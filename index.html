<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfólio de Lucas Henrique, desenvolvedor front-end: projetos, skills e contato."
    />
    <meta name="theme-color" content="#0f1226" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lucas Henrique | Desenvolvedor Front-end</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita flash de tema errado)
      try {
        var t = localStorage.getItem('portfolio-theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
